name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            ldflags: -H=windowsgui
            binary: build/bin/atropos.exe
            asset-name: atropos-windows-amd64.exe
          - name: macOS
            os: macos-latest
            ldflags: ""
            binary: build/bin/atropos
            asset-name: atropos-macos-universal.zip
          - name: Linux
            os: ubuntu-latest
            ldflags: ""
            binary: build/bin/atropos
            asset-name: atropos-linux-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install Linux Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libxcursor-dev libffi-dev

      - name: Compute version string
        shell: bash
        run: echo "APP_VERSION=$(git log -1 --format=%cd-%h --date=format:%Y%m%d --abbrev=6)" >> "$GITHUB_ENV"

      - name: Build application
        shell: bash
        run: |
          mkdir -p build/bin
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-X main.AppVersion=$APP_VERSION" -o build/bin/atropos-amd64 .
            CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-X main.AppVersion=$APP_VERSION" -o build/bin/atropos-arm64 .
            lipo -create -output "${{ matrix.binary }}" build/bin/atropos-amd64 build/bin/atropos-arm64
          else
            go build -ldflags "${{ matrix.ldflags }} -X main.AppVersion=$APP_VERSION" -o "${{ matrix.binary }}" .
          fi

      - name: Package binary for release
        shell: bash
        run: |
          if [[ "${{ matrix.asset-name }}" == *.zip ]]; then
            cd build/bin && zip -r "$GITHUB_WORKSPACE/${{ matrix.asset-name }}" atropos
          else
            cp "${{ matrix.binary }}" "${{ matrix.asset-name }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset-name }}
          path: ${{ matrix.asset-name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
